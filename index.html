<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrTan Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0f0f13; color: #ffffff; font-family: Arial, sans-serif; padding: 20px; }
        h1 { text-align: center; color: #ff4757; text-transform: uppercase; }
        .product-card { background-color: #1c1c24; border-radius: 16px; padding: 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .info h3 { margin: 0 0 5px 0; font-size: 17px; }
        .info p { margin: 0; font-size: 13px; color: #8b8b9a; }
        .btn-buy { background: #ff4757; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <h1>TRTAN STORE</h1>

    <div class="product-card">
        <div class="info">
            <h3>Acc Thường - 50k</h3>
            <p>Rank Kim Cương | Nhiều skin</p>
        </div>
        <button class="btn-buy" onclick="muaAcc('Acc Thuong 50k')">Mua</button>
    </div>

    <div class="product-card">
        <div class="info">
            <h3>Acc VIP - 150k</h3>
            <p>Rank Cao Thủ | Skin súng đỏ</p>
        </div>
        <button class="btn-buy" onclick="muaAcc('Acc VIP 150k')">Mua</button>
    </div>

    <script>
        function muaAcc(tenAcc) {
            let usernameTelegram = "TrTanStore_bot";
            let text = encodeURIComponent("Chào shop, t muốn mua: " + tenAcc);
            window.open(`https://t.me/${usernameTelegram}?text=${text}`, '_blank');
        }
    </script>
</body>
</html>
